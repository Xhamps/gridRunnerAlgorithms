server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ =404;
  }

  # assets change on every deploy and have no hash in the name: revalidate instead of caching blindly
  location /assets/ {
    add_header Cache-Control "no-cache";
  }

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }
}
